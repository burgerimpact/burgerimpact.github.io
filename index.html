<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURGERIS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #ededed; padding-bottom: 60px; }
        a { color: inherit; text-decoration: none; }

        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 20px 60px; 
            background-color: #0d0d0d; 
            border-bottom: 1px solid #161616; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo { font-weight: bold; font-size: 20px; letter-spacing: 2px; color: #fff; cursor: pointer; justify-self: start; }
        .nav-links { display: flex; gap: 35px; justify-self: center; }
        .nav-item { color: #888; font-weight: 500; transition: 0.2s; font-size: 15px; }
        .nav-item:hover { color: #fff; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .banner { background: linear-gradient(90deg, #111111 0%, #181818 100%); border: 1px solid #1e1e1e; border-radius: 16px; padding: 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; position: relative; }
        .banner-title { font-size: 36px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .banner-subtitle { color: #666; font-size: 14px; }
        .timer-box { background: rgba(0, 0, 0, 0.5); border: 1px solid #252525; padding: 18px 30px; border-radius: 12px; text-align: center; min-width: 240px; }
        .timer-label { font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .timer-val { font-size: 26px; font-weight: bold; color: #fff; font-family: monospace; letter-spacing: 1px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
        .section-title { font-size: 22px; font-weight: 600; color: #fff; }
        .view-all { font-size: 14px; color: #555; transition: 0.2s; }
        .view-all:hover { color: #aaa; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }

        .card { 
            background: #121212; 
            border: 1px solid #1e1e1e; 
            border-radius: 14px; 
            overflow: hidden; 
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s; 
            aspect-ratio: 2 / 3.4; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }
        
        .card:hover { 
            transform: scale(1.03); 
            border-color: #444; 
        }

        .card-img { 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s;
        }
        
        .card:hover .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.85) 80%, rgba(0,0,0,0.4) 100%);
        }

        .card-name { 
            font-size: 20px; 
            font-weight: 700; 
            color: #fff; 
            text-align: center;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            transition: opacity 0.2s, transform 0.3s;
            height: 24px;
        }
        
        .icon-container {
            width: 24px;
            height: 24px;
            overflow: hidden;
            display: block;
        }

        .icon-pyro {
            width: 24px;
            height: 24px;
            filter: drop-shadow(#ff9999 0px -24px 0px);
            transform: translateY(24px);
            display: block;
        }

        .icon-catalyst {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        .card-stats {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin-top: 0;
            max-height: 0; 
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .stat-icon-img {
            width: 16px;
            height: 16px;
            object-fit: contain;
            filter: invert(1);
        }

        .card:hover .card-icons {
            opacity: 0;
            transform: translateY(-5px);
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        .card:hover .card-stats {
            max-height: 50px; 
            opacity: 1;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            header { padding: 15px 20px; }
            .nav-links { gap: 15px; }
            .banner { padding: 20px; flex-direction: column; gap: 20px; text-align: center; }
            .timer-box { min-width: 100%; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-name { font-size: 15px; margin-bottom: 6px; }
            .stat-item { font-size: 10px; gap: 4px; }
        }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">BURGERIS</a>
        <nav class="nav-links">
            <a href="characters.html" class="nav-item">Персонажи</a>
            <a href="weapons.html" class="nav-item">Оружие</a>
        </nav>
        <div></div>
    </header>

    <div class="container">
        
        <div class="banner">
            <div>
                <div class="banner-title">BURGERIS</div>
                <div class="banner-subtitle">От Бургер Кинга до Ожирения</div>
            </div>
            <div class="timer-box">
                <div class="timer-label">До следующего обновления беты</div>
                <div class="timer-val" id="countdown-timer">67</div>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title">Последние добавленные персонажи</h2>
            <a href="characters.html" class="view-all">просмотреть все →</a>
        </div>

        <div class="grid">
            
            <a href="characters/lily.html" class="card">
                <div class="card-img" style="background-image: url('assets/lily/UI_Gacha_AvatarIcon_Lily.png');"></div>
                <div class="card-overlay">
                    <div class="card-name">Лиля</div>
                    
                    <div class="card-icons">
                        <span class="icon-container">
                            <img src="assets/icons/pyro.webp" class="icon-pyro" alt="Pyro">
                        </span>
                        <img src="assets/icons/catalyst.webp" class="icon-catalyst" alt="Catalyst">
                    </div>
                    
                    <div class="card-stats">
                        <div class="stat-item">
                            <img src="assets/icons/hp_base.webp" class="stat-icon-img" alt="HP_BASE">
                            10,409
                        </div>
                        <div class="stat-item">
                            <img src="assets/icons/atk_base.webp" class="stat-icon-img" alt="ATK_BASE">
                            394
                        </div>
                        <div class="stat-item">
                            <img src="assets/icons/def_base.webp" class="stat-icon-img" alt="DEF_BASE">
                            563
                        </div>
                        <div class="stat-item">
                            <img src="assets/icons/atk.webp" class="stat-icon-img" alt="ATK">
                            28.8%
                        </div>
                    </div>
                </div>
            </a>

        </div>
    </div>

    <script>
        const targetDate = new Date("Oct 15, 2026 18:00:00").getTime();
        const timerElement = document.getElementById("countdown-timer");

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const displayHours = hours < 10 ? "0" + hours : hours;
            const displayMinutes = minutes < 10 ? "0" + minutes : minutes;
            const displaySeconds = seconds < 10 ? "0" + seconds : seconds;

            timerElement.innerHTML = `${days}d ${displayHours}:${displayMinutes}:${displaySeconds}`;

            if (distance < 0) {
                clearInterval(countdownInterval);
                timerElement.innerHTML = "Мама умерла";
            }
        }, 1000);
    </script>


</body></html>
