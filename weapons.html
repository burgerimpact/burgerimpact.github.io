<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURGERIS - Оружие</title>
    <style>
        html {
            scrollbar-gutter: stable;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ededed;
            padding-bottom: 60px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 60px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #161616;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 2px;
            color: #fff;
            cursor: pointer;
            justify-self: start;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            justify-self: center;
        }

        .nav-item {
            color: #888;
            font-weight: 500;
            transition: 0.2s;
            font-size: 15px;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-item.active-menu {
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 12px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .wpn-count {
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: #121212;
            border: 1px solid #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
            aspect-ratio: 2 / 3.4;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: scale(1.04);
            border-color: #444;
        }

        .card-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 60%, rgba(0, 0, 0, 0) 100%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s;
        }

        .card:hover .card-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.98) 0%, rgba(0, 0, 0, 0.85) 80%, rgba(0, 0, 0, 0.4) 100%);
        }

        .card-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.3;
        }

        .card-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s, transform 0.3s;
            height: 20px;
        }

        .icon-bow {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
            filter: invert(1);
        }

        .card-stats {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            margin-top: 0;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
        }

        .stat-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            width: 100%;
            text-align: center;
        }

        .stat-icon-img {
            width: 15px;
            height: 15px;
            object-fit: contain;
            filter: invert(1);
        }

        .card:hover .card-icons {
            opacity: 0;
            transform: translateY(-5px);
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        .card:hover .card-stats {
            max-height: 48px;
            opacity: 1;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            header {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card-name {
                font-size: 14px;
                margin-bottom: 6px;
            }

            .stat-item {
                font-size: 11px;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">BURGERIS</a>
        <nav class="nav-links">
            <a href="characters.html" class="nav-item">Персонажи</a>
            <a href="weapons.html" class="nav-item active-menu">Оружие</a>
        </nav>
        <div></div>
    </header>

    <div class="container">

        <div class="section-header">
            <h2 class="section-title">Все оружие</h2>
            <span class="wpn-count" id="total-count">Всего: 2</span>
        </div>

        <div class="grid">

            <a href="weapons/star_wedge.html" class="card">
                <div class="card-img" style="background-image: url('assets/weapons/UI_Gacha_EquipIcon_Catalyst_Ashes.png');"></div>
                <div class="card-overlay">
                    <div class="card-name">Псалом гиперборейского пепла</div>

                    <div class="card-icons">
                        <img src="assets/icons/bow.webp" class="icon-bow" alt="Bow">
                    </div>

                    <div class="card-stats">
                        <div class="stat-item">
                            <img src="assets/icons/atk_base.webp" class="stat-icon-img" alt="Base ATK">
                            608
                        </div>
                        <div class="stat-item">
                            <img src="assets/icons/crit_dmg.webp" class="stat-icon-img" alt="Crit DMG">
                            66.2%
                        </div>
                    </div>
                </div>
            </a>

            <a href="weapons/weapon2.html" class="card">
                <div class="card-img" style="background-image: url('assets/lily/UI_Gacha_AvatarIcon_Lily.png');"></div>
                <div class="card-overlay">
                    <div class="card-name">Звездный Клин</div>

                    <div class="card-icons">
                        <img src="assets/icons/bow.webp" class="icon-bow" alt="Bow">
                    </div>

                    <div class="card-stats">
                        <div class="stat-item">
                            <img src="assets/icons/atk_base.webp" class="stat-icon-img" alt="Base ATK">
                            608
                        </div>
                        <div class="stat-item">
                            <img src="assets/icons/crit_dmg.webp" class="stat-icon-img" alt="Crit DMG">
                            66.2%
                        </div>
                    </div>
                </div>
            </a>

        </div>
    </div>

</body>

</html>
